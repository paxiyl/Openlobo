name: Build OpenMyau Ravn Port

on:
  workflow_dispatch:

  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source ZIP
        run: |
          mkdir extracted
          unzip -q OpenMyau-Ravn-Ported-Final.zip -d extracted

      - name: Verify project
        working-directory: extracted/work_v4
        run: |
          echo "Current directory:"
          pwd
          echo
          echo "Project files:"
          ls -la
          echo
          echo "Gradle wrapper:"
          ls -la gradle/wrapper/
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradlew
          test -f build.gradle.kts
          test -f settings.gradle.kts

      - name: Make Gradle executable
        working-directory: extracted/work_v4
        run: chmod +x gradlew

      - name: Build project
        working-directory: extracted/work_v4
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: OpenMyau-Ravn-Ported
          path: extracted/work_v4/build/libs/*.jar
          if-no-files-found: error

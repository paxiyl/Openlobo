name: Build OpenMyau Ravn Port

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Extract source
        run: |
          unzip -q OpenMyau-Ravn-Ported-Final.zip -d extracted

      - name: Build
        working-directory: extracted/work_v4
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: OpenMyau-Ravn-Ported
          path: extracted/work_v4/build/libs/*.jar
          if-no-files-found: error
